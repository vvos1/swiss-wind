<style>
/* Layout: full-height map with a station rail on the left; stacks on phones. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --fg:#14232b; --muted:#5d6f78; --line:#d9e0e3; --accent:#0b6e8a;

}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--panel:#16252d;--fg:#e4edf0;--muted:#8fa4ad;--line:#294049;--accent:#5cc3de;--ok:#5fcf93;--warn:#e8a63a;--bad:#ef7a6e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center;padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:.01em}
.ctl{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.ctl label{display:flex;gap:.35rem;align-items:center;cursor:pointer}
select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.2rem .5rem}
button{cursor:pointer}button:hover{border-color:var(--accent)}
#status{margin-left:auto;font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;gap:.9rem;flex-wrap:wrap}
#status .ok{color:var(--ok)}#status .bad{color:var(--bad)}
main{flex:1;min-height:0;position:relative}
#widget{position:absolute;right:12px;top:56px;width:340px;max-width:calc(100% - 24px);max-height:calc(100% - 110px);display:flex;flex-direction:column;z-index:1100;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.28);overflow:hidden}
#widget[hidden],#widgetOpen[hidden]{display:none}
#widgetHead{display:flex;align-items:center;justify-content:space-between;padding:.45rem .6rem .45rem .9rem;border-bottom:1px solid var(--line);font-weight:600;font-size:.85rem}
#widgetHead button{border:0;background:none;font-size:1rem;line-height:1;padding:.2rem .4rem;color:var(--muted)}
#widgetOpen{position:absolute;right:12px;top:56px;z-index:1100;box-shadow:0 2px 8px rgba(0,0,0,.3);border-radius:8px;padding:.4rem .7rem;font-weight:500}
#rail{overflow:auto;min-width:0;flex:1}
#map{position:absolute;inset:0;background:#cfd8dc}
.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:.7rem .9rem .3rem;position:sticky;top:0;background:var(--panel);z-index:2}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:.15rem .7rem;padding:.55rem .9rem;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:hover{background:var(--bg)}
.row.stale{opacity:.55}
.arrow{width:34px;height:34px}
.nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.val{font-family:var(--mono);text-align:right;font-size:.95rem;font-weight:500}
.val small{display:block;color:var(--muted);font-weight:400;font-size:.74rem}
.tag{display:inline-block;font-size:.66rem;padding:0 .35rem;border:1px solid var(--line);border-radius:3px;margin-left:.35rem;color:var(--muted);vertical-align:1px;font-family:var(--mono)}
.err{padding:.6rem .9rem;color:var(--bad);font-size:.82rem;border-top:1px solid var(--line)}
.note{padding:.6rem .9rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line)}
.wm{position:relative;width:46px;height:46px;display:flex;flex-direction:column;align-items:center}
.wm svg{width:34px;height:34px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.wm b{font:600 11px/1 var(--mono);background:rgba(255,255,255,.92);color:#14232b;border-radius:8px;padding:2px 5px;margin-top:-4px;box-shadow:0 1px 2px rgba(0,0,0,.3);white-space:nowrap}
.wm.stale{opacity:.5}
.spot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--accent)}
.leaflet-popup-content{font:13px/1.45 var(--sans);min-width:190px}
.leaflet-popup-content table{border-collapse:collapse;width:100%}
.leaflet-popup-content td{padding:1px 0}.leaflet-popup-content td:last-child{text-align:right;font-family:var(--mono)}
.legend{background:rgba(255,255,255,.93);color:#14232b;padding:.4rem .6rem;border-radius:4px;font:11px/1.2 var(--mono);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.legend i{display:inline-block;width:12px;height:10px;margin-right:4px;vertical-align:-1px}
@media (max-width:760px){
  #widget{max-height:45%;top:auto;bottom:34px}#widgetOpen{top:auto;bottom:34px}
  #status{margin-left:0}
}

<header>

function parseStations(txt){
  return txt.trim().split("\n").map(l=>l.split("|")).map(([code,name,lat,lon,alt,canton])=>
    ({id:"smn:"+code,code,name,lat:+lat,lon:+lon,alt:+alt,canton,src:"MeteoSwiss"}));
}

async function augmentStations(){

    const r = await fetch("https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/ogd-smn_meta_stations.csv");
    if(!r.ok) return;
    const txt = new TextDecoder("windows-1252").decode(await r.arrayBuffer());
    const lines = txt.trim().split(/\r?\n/), head = lines[0].split(";");
    const ix = n=>head.indexOf(n), have = new Set(SMN_ALL.map(s=>s.code));
    for(const l of lines.slice(1)){
      const c = l.split(";"), code = c[ix("station_abbr")], lat = parseFloat(c[ix("station_coordinates_wgs84_lat")]), lon = parseFloat(c[ix("station_coordinates_wgs84_lon")]);
      if(!code || have.has(code) || isNaN(lat) || isNaN(lon)) continue;
      SMN_ALL.push({id:"smn:"+code,code,name:c[ix("station_name")],lat,lon,alt:parseFloat(c[ix("station_height_masl")]),canton:c[ix("station_canton")],src:"MeteoSwiss"});
    }
  }catch(e){ /* keep the embedded list */ }
}

/* ============ ADAPTERS ============ */
async function loadSMN(st){
  const url = `https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/${st.code.toLowerCase()}/ogd-smn_${st.code.toLowerCase()}_t_now.csv`;
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const lines = (await r.text()).trim().split(/\r?\n/);
  const head = lines[0].split(";"), ix = n => head.indexOf(n);
  const iT=ix("reference_timestamp"), iA=ix("fu3010z0"), iG=ix("fu3010z1"), iD=ix("dkl010z0"), iTemp=ix("tre200s0");
  const rows = lines.slice(1).map(l=>l.split(";")).map(c=>({ts:parseUTC(c[iT]),avg:num(c[iA]),gust:num(c[iG]),dir:num(c[iD]),temp:num(c[iTemp])}))
    .filter(x=>x.ts && x.avg!=null);
  if(!rows.length) throw new Error("no wind rows");
  const last = rows[rows.length-1];
  return {...st, ...last, hist: rows.slice(-13)};
}
async function loadPiou(){
  const r = await fetch("https://api.pioupiou.fr/v1/live-with-meta/all");
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  return j.data.filter(d=>d.location&&d.location.success&&d.location.latitude>=PIOU_BBOX.s&&d.location.latitude<=PIOU_BBOX.n&&
      d.location.longitude>=PIOU_BBOX.w&&d.location.longitude<=PIOU_BBOX.e&&d.measurements&&d.measurements.wind_speed_avg!=null)
    .map(d=>({id:"pp:"+d.id,name:d.meta.name||("Pioupiou "+d.id),lat:d.location.latitude,lon:d.location.longitude,alt:null,src:"OpenWindMap",
      ts:Date.parse(d.measurements.date),avg:d.measurements.wind_speed_avg,gust:d.measurements.wind_speed_max,dir:d.measurements.wind_heading,hist:null,
      url:"https://www.openwindmap.org/PP"+d.id}));
}
async function loadWU(){
  const base = WU.map(s=>{ const o={...s}; if(s.snap){ o.ts=Date.parse(s.snap.ts); o.avg=s.snap.avg; o.gust=s.snap.gust; o.dir=s.snap.dir; o.manual=true; } return o; });
  if(!WU_FEED_URL) return base;
  const r = await fetch(WU_FEED_URL, {cache:"no-store"});
  if(!r.ok) throw new Error("Wunderground feed HTTP "+r.status);
  const feed = await r.json();                      // [{id, ts, avg, gust, dir, temp}]  speeds in km/h, ts in ms
  return base.map(o=>{ const f = feed.find(x=>"wu:"+x.id===o.id); if(!f || f.avg==null) return o;
    return {...o, ts:f.ts, avg:f.avg, gust:f.gust, dir:f.dir, temp:f.temp, manual:false, offlineNote:undefined}; });
}

async function loadFeed(fd){
  const r = await fetch(fd.file,{cache:"no-store"});
  if(!r.ok) throw new Error(fd.label+" feed HTTP "+r.status);
  const j = await r.json(), arr = Array.isArray(j) ? j : [j], res = [];
  for(const f of arr){ const st = fd.sts[f.id]; if(st && f.avg!=null) res.push({...st, ts:f.ts, avg:f.avg, gust:f.gust, dir:f.dir, temp:f.temp, hist:null}); }
  if(!res.length) throw new Error(fd.label+": no wind value");

// One file with every MeteoSwiss + OpenWindMap station, built by the scheduled job (so visitors don't download ~160 CSVs)
async function loadSwissFeed(){
  const r = await fetch("swiss.json",{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  if(!j.smn || !j.smn.length) throw new Error("empty");
  return [
    ...j.smn.map(d=>({...d, id:"smn:"+d.code, src:"MeteoSwiss"})),
    ...(j.slf||[]).map(d=>({id:"slf:"+d.code,name:d.name,lat:d.lat,lon:d.lon,alt:d.alt,src:"SLF IMIS (30-min mean)",ts:d.ts,avg:d.avg,gust:d.gust,dir:d.dir,temp:d.temp,hist:null,staleMin:75,url:"https://whiterisk.ch/en/conditions"})),
    ...(j.metar||[]).map(d=>({id:"metar:"+d.id,name:d.name+" ("+d.id+")",lat:d.lat,lon:d.lon,alt:d.alt,src:"METAR airport",ts:d.ts,avg:d.avg,gust:d.gust,dir:d.dir,temp:d.temp,hist:null,staleMin:100,url:"https://aviationweather.gov/data/metar/?ids="+d.id})),
    ...(j.winds||[]).map(d=>({id:"wm:"+d.id,name:d.name,lat:d.lat,lon:d.lon,alt:d.alt,src:"winds.mobi · "+(d.provider||"network"),ts:d.ts,avg:d.avg,gust:d.gust,dir:d.dir,temp:d.temp,hist:null,staleMin:60,url:"https://winds.mobi/stations/"+encodeURIComponent(d.id)})),
    ...j.piou.map(d=>({id:"pp:"+d.id,name:d.name,lat:d.lat,lon:d.lon,alt:null,src:"OpenWindMap",ts:d.ts,avg:d.avg,gust:d.gust,dir:d.dir,hist:null,url:"https://www.openwindmap.org/PP"+d.id}))
  ];
}

async function refresh(){
  $("#refresh").disabled = true;
  if(!state.augmented){ state.augmented = true; await augmentStations(); }
  const errors=[], out=[];
  let feed = null;
  try{ feed = (await loadSwissFeed()).filter(inRegion); }catch(e){ /* no aggregate yet: fall back to fetching every station from the browser */ }
  const jobs = [];
  if(feed){ out.push(...feed); }
  else {
    const todo = SMN_ALL.filter(inRegion); let done=0;
    jobs.push(
      pool(todo, 8, async st=>{
        try{ out.push(await loadSMN(st)); }catch(e){ errors.push(`${st.code}: ${e.message}`); }
        $("#status").textContent = `loading MeteoSwiss ${++done}/${todo.length}…`;
      }),
      loadPiou().then(a=>out.push(...a.filter(inRegion))).catch(e=>errors.push("OpenWindMap: "+e.message)));
  }
  jobs.push(
    ...FEEDS.map(fd=>loadFeed(fd).then(x=>out.push(...x)).catch(e=>errors.push(String(e.message||e)))),
    loadWU().then(a=>out.push(...a)).catch(e=>{ errors.push(String(e.message||e)); out.push(...WU.map(s=>({...s}))); }));
  await Promise.all(jobs);
  state.stations = new Map(out.map(s=>[s.id,s])); state.errors = errors; state.updated = Date.now();
  render(); $("#refresh").disabled = false;
}

/* ============ INDICATORS ============ */
function trend(s){
  if(!s.hist || s.hist.length<6) return null;
  const h=s.hist, a=h.slice(-3), b=h.slice(-6,-3);
  const m=x=>x.reduce((t,r)=>t+r.avg,0)/x.length;
  return kn(m(a))-kn(m(b));                      // knots, last 30 min vs the 30 min before
}
const trendGlyph = t => t==null ? "" : t>1.5 ? "↑" : t<-1.5 ? "↓" : "→";
const gustFactor = s => s.avg>2 && s.gust!=null ? s.gust/s.avg : null;
function spark(s){
  if(!s.hist) return "";
  const h=s.hist, W=84, H=24, mx=Math.max(...h.map(r=>r.gust??r.avg),1);
  const px=i=>(i/(h.length-1))*W, py=v=>H-2-(v/mx)*(H-4);
  const line=k=>h.map((r,i)=>`${i?"L":"M"}${px(i).toFixed(1)} ${py(r[k]??r.avg).toFixed(1)}`).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${line("gust")}" fill="none" stroke="var(--muted)" stroke-width="1" opacity=".6"/><path d="${line("avg")}" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>`;
}
const arrowSVG = (s,sz) => { const c=colorFor(s.avg), rot=((s.dir??0)+180)%360;
  return `<svg viewBox="-20 -20 40 40" style="transform:rotate(${rot}deg)"><path d="M0 -17 L10 11 L0 5 L-10 11 Z" fill="${c}" stroke="#102028" stroke-width="1.4" stroke-linejoin="round"/></svg>`; };


/* ============ CANVAS WIND LAYER (one <canvas> instead of hundreds of DOM markers: much lighter to pan/zoom) ============ */
const WindCanvas = L.Layer.extend({
  onAdd(map){
    this._map = map; this._items = [];
    const c = this._c = L.DomUtil.create("canvas", "leaflet-zoom-hide");
    c.style.position = "absolute"; c.style.pointerEvents = "none";
    map.getPane("markerPane").appendChild(c);
    this._click = e => this._onClick(e); this._move = L.Util.throttle(e => this._onMove(e), 60, this);
    map.on("click", this._click); map.on("mousemove", this._move);
    this._reset();
  },
  onRemove(map){ L.DomUtil.remove(this._c); map.off("click", this._click); map.off("mousemove", this._move); },
  getEvents(){ return {moveend:this._reset, zoomend:this._reset, resize:this._reset}; },
  setItems(items){ this._items = items; this._reset(); },
  _reset(){
    const map = this._map, sz = map.getSize(), pad = 0.5, dpr = window.devicePixelRatio || 1;
    const w = Math.round(sz.x*(1+2*pad)), h = Math.round(sz.y*(1+2*pad));   // drawn bigger than the screen so panning shows no blank edge
    const c = this._c; c.width = w*dpr; c.height = h*dpr; c.style.width = w+"px"; c.style.height = h+"px";
    this._tl = map.containerPointToLayerPoint([-sz.x*pad, -sz.y*pad]);
    L.DomUtil.setPosition(c, this._tl);
    const ctx = c.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.font = '600 11px ui-monospace, Menlo, Consolas, monospace'; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for(const s of this._items.slice().reverse()){          // items arrive best-first: draw them last so they end up on top
      const p = map.latLngToLayerPoint([s.lat,s.lon]).subtract(this._tl);
      if(p.x < -40 || p.y < -40 || p.x > w+40 || p.y > h+40) continue;
      this._draw(ctx, s, p.x, p.y);
    }
  },
  _draw(ctx, s, x, y){
    const stale = ageMin(s.ts) > staleLimit(s) || s.avg == null;
    ctx.globalAlpha = stale ? 0.5 : 1;
    if(s.avg == null){
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.2832); ctx.fillStyle = "#8aa0ab"; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = "#102028"; ctx.stroke();
    } else {
      ctx.save(); ctx.translate(x, y); ctx.rotate((((s.dir ?? 0) + 180) % 360) * Math.PI/180); ctx.scale(0.85, 0.85);
      ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(10,11); ctx.lineTo(0,5); ctx.lineTo(-10,11); ctx.closePath();
      ctx.fillStyle = colorFor(s.avg); ctx.fill(); ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.strokeStyle = "#102028"; ctx.stroke(); ctx.restore();
    }
    const txt = s.avg == null ? "off" : fmt(s.avg) + (s.gust != null ? "/" + fmt(s.gust) : "");
    const tw = ctx.measureText(txt).width + 10, ly = y + 19;
    ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x - tw/2, ly - 8, tw, 16, 8); else ctx.rect(x - tw/2, ly - 8, tw, 16);
    ctx.fill(); ctx.fillStyle = "#14232b"; ctx.fillText(txt, x, ly + 0.5);
    ctx.globalAlpha = 1;
  },
  _hit(pt){
    let best = null, bd = 26*26;
    for(const s of this._items){ const q = this._map.latLngToContainerPoint([s.lat,s.lon]), dx = q.x-pt.x, dy = (q.y+6)-pt.y, d = dx*dx+dy*dy; if(d < bd){ bd = d; best = s; } }
    return best;
  },
  _onClick(e){ const s = this._hit(e.containerPoint); if(s) openStation(s); },
  _onMove(e){ this._map.getContainer().style.cursor = this._hit(e.containerPoint) ? "pointer" : ""; }
});
function openStation(s){ L.popup({offset:[0,-4]}).setLatLng([s.lat,s.lon]).setContent(popup(s)).openOn(map); }

/* ============ RENDER ============ */
let map, layer, spotLayer, markers = {};
function visible(){
  const low=$("#lowOnly").checked;
  return [...state.stations.values()].filter(s=>!low || s.alt==null || s.alt<700);
}
function popup(s){
  const g=gustFactor(s), t=trend(s), stale=ageMin(s.ts)>staleLimit(s);
  let h=`<b>${esc(s.name)}</b><span class="tag">${esc(s.src)}</span><table>`;
  if(s.avg==null){ h+=`<tr><td colspan="2">${esc(s.offlineNote||"No data")}</td></tr>`; }
  else{
    h+=`<tr><td>Average</td><td>${fmt(s.avg)} ${U()}</td></tr><tr><td>Gust</td><td>${fmt(s.gust)} ${U()}</td></tr>`+
       `<tr><td>From</td><td>${card(s.dir)} ${s.dir!=null?Math.round(s.dir)+"°":""}</td></tr>`+
       (g?`<tr><td>Gust factor</td><td>${g.toFixed(1)}×${g>1.6?" (gusty)":""}</td></tr>`:"")+
       (t!=null?`<tr><td>30 min trend</td><td>${trendGlyph(t)} ${t>0?"+":""}${t.toFixed(1)} kn</td></tr>`:"")+
       (s.temp!=null?`<tr><td>Temp</td><td>${s.temp.toFixed(1)} °C</td></tr>`:"")+
       `<tr><td>Updated</td><td>${ago(s.ts)}${stale?" (stale)":""}</td></tr>`;
    if(s.manual) h+=`<tr><td colspan="2" style="color:#b3362b">Manual snapshot, not live</td></tr>`;
  }
  h+="</table>"; if(s.alt!=null) h+=`<div style="color:#5d6f78">${s.alt} m</div>`;
  if(s.url) h+=`<div><a href="${s.url}" target="_blank" rel="noopener">Open source page</a></div>`;
  return h;
}
// Which markers to draw: nearest-priority-first, skipping any that would sit on top of one already placed.
// Zoomed out you see the important stations; zooming in frees up space and more appear.
const PRIORITY = s => {
  const base = /Wunderground|YvBeach|VD8|Ichtus|CVN|Cudrefin/.test(s.src) ? 0 : s.src==="MeteoSwiss" ? 1 : (s.src==="OpenWindMap" || /winds\.mobi/.test(s.src)) ? 2 : /METAR/.test(s.src) ? 3 : 4;
  return base === 0 ? 0 : base + ((s.avg==null || ageMin(s.ts)>staleLimit(s)) ? 10 : 0);   // dead or stale stations never win a spot over a live one
};
function pickShown(list){
  const bounds = map.getBounds().pad(0.15), CELL = 30, taken = new Map(), out = [];
  if(!$("#thin").checked) return list.filter(s=>bounds.contains([s.lat,s.lon]));
  const order = list.filter(s=>bounds.contains([s.lat,s.lon])).map(s=>({s,p:PRIORITY(s)})).sort((a,b)=>a.p-b.p || String(a.s.id).localeCompare(b.s.id));
  for(const {s} of order){
    const pt = map.latLngToContainerPoint([s.lat,s.lon]), cx = Math.floor(pt.x/CELL), cy = Math.floor(pt.y/CELL);
    let clash = false;
    for(let dx=-1; dx<=1 && !clash; dx++) for(let dy=-1; dy<=1 && !clash; dy++){
      const q = taken.get((cx+dx)+","+(cy+dy)); if(q && Math.abs(q.x-pt.x)<CELL && Math.abs(q.y-pt.y)<CELL) clash = true;
    }
    if(clash) continue;
    taken.set(cx+","+cy, pt); out.push(s);
  }
  return out;
}
function render(){
  const list = visible().sort((a,b)=>(b.avg??-1)-(a.avg??-1));
  markers = {}; for(const s of list) markers[s.id] = s;
  state.list = list;
  redraw();
}
let redrawTimer = null;
const redrawSoon = () => { clearTimeout(redrawTimer); redrawTimer = setTimeout(()=>{ if(state.list) redraw(); }, 120); };
function redraw(){
  const list = state.list, shown = pickShown(list);
  layer.setItems(shown);
  // rail
  const fresh = list.filter(s=>s.avg!=null);
  let h = `<div class="sec">Stations in view · ${shown.length} of ${fresh.length} reporting · ${U()} (avg / gust)</div>`;
  for(const s of shown.slice(0,50)){
    const stale = ageMin(s.ts)>staleLimit(s) || s.avg==null, t=trend(s), g=gustFactor(s);
    h+=`<div class="row ${stale?"stale":""}" data-id="${s.id}">
      <div class="arrow">${s.avg==null?"":arrowSVG(s)}</div>
      <div style="min-width:0"><div class="nm">${esc(s.name)}<span class="tag">${esc(s.src)}</span></div>
        <div class="sub">${s.avg==null?esc(s.offlineNote||"no data"):`${card(s.dir)} ${s.dir!=null?Math.round(s.dir)+"°":""} · ${ago(s.ts)}${s.manual?" · snapshot":""}${g&&g>1.6?" · gusty":""}`}</div>
        ${spark(s)}</div>
      <div class="val">${s.avg==null?"–":fmt(s.avg)}<small>${s.avg==null?"":`${fmt(s.gust)} ${trendGlyph(t)}`}</small></div></div>`;
  }
  // spots
  h += `<div class="sec">Your spots · nearest live station</div>`;
  const live = fresh.filter(s=>ageMin(s.ts)<=staleLimit(s) && !s.manual);
  spotLayer.clearLayers();
  for(const sp of SPOTS){
    const near = live.map(s=>({s,d:hav(sp,s)})).sort((a,b)=>a.d-b.d).slice(0,3);
    h+=`<div class="row" data-spot="${esc(sp.name)}" style="grid-template-columns:1fr"><div><div class="nm">${esc(sp.name)}</div>`+
      (near.length? near.map(n=>`<div class="sub">${esc(n.s.name)} · ${n.d.toFixed(0)} km · ${fmt(n.s.avg)}/${fmt(n.s.gust)} ${U()} ${card(n.s.dir)}</div>`).join("") : `<div class="sub">no live station</div>`)+`</div></div>`;
  }
  if(state.errors.length) h+=`<div class="err"><b>${state.errors.length} feed(s) failed</b><br>${state.errors.slice(0,6).map(esc).join("<br>")}</div>`;
  h+=`<div class="note">Sources: MeteoSwiss open data (cite “Source: MeteoSwiss”), OpenWindMap/Pioupiou network, winds.mobi (Holfuy, FFVL and other networks), SLF IMIS, airport METAR, Weather Underground dashboards (manual snapshot). Wind direction is where the wind comes from; arrows point where it blows to. Gust = max over the last 10 min (MeteoSwiss) or 4 min (OpenWindMap).</div>`;
  if(h !== state.railHtml){ state.railHtml = h; $("#rail").innerHTML = h; }
  const ok = state.stations.size - state.errors.length;
  $("#status").innerHTML = `<span class="${state.errors.length?"bad":"ok"}">${state.errors.length?state.errors.length+" feed errors":"all feeds ok"}</span><span>updated ${new Date(state.updated).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</span>`;
}
