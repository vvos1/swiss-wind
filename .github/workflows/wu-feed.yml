name: wu-feed
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"      # backup only: GitHub's cron has proven unreliable here; the run below restarts itself
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]          # a change to the page redeploys it
permissions:
  contents: write
  actions: write
concurrency:
  group: wu-feed
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape and publish Wunderground observations (3 passes per run, about 100 s apart)
        run: |
          mkdir -p site
          # bring back the previous 24 h history from the published branch (the branch is replaced every pass)
          git fetch -q --depth=1 origin gh-pages && git show FETCH_HEAD:history.json > site/history.json 2>/dev/null || { rm -f site/history.json; echo "no previous history"; }
          git init -q -b gh-pages site 2>/dev/null || true
          scrape() {
            node wu-feed/scrape-yvbeach.mjs site/yv.json || echo "YvBeach scrape failed"
            node wu-feed/scrape-vd8.mjs site/vd8.json || echo "VD8 scrape failed"
            node wu-feed/scrape-ichtus.mjs site/ichtus.json || echo "Ichtus scrape failed"
            node wu-feed/scrape-wu.mjs site/wu.json || true
            if ! node -e 'const d=JSON.parse(require("fs").readFileSync("site/wu.json","utf8")); process.exit(d.every(x=>!x.error)?0:1)' 2>/dev/null; then
              echo "Fast method failed, using headless browser"
              [ -d node_modules/playwright ] || npm install --no-save playwright@1.49.1
              node wu-feed/scrape-wu-browser.mjs site/wu.json || {
                npx playwright install --with-deps chromium
                node wu-feed/scrape-wu-browser.mjs site/wu.json
              }
            fi
          }
          publish() {
            ( cd site
              rm -rf .git && git init -q -b gh-pages
              git config user.name "wu-feed"; git config user.email "wu-feed@users.noreply.github.com"
              git add -A; git commit -q -m "update $(date -u +%FT%TZ)"
              git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages )
          }
          for i in 1 2 3; do
            if [ $i -eq 1 ]; then node wu-feed/scrape-swiss.mjs site/swiss.json || echo "Swiss aggregate failed"; fi
            scrape; node wu-feed/build-history.mjs site || echo "history update failed"; publish
            if [ $i -lt 3 ]; then sleep 100; fi
          done
      - name: Start the next run (self-restarting chain, so we do not depend on GitHub's cron)
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run wu-feed.yml --repo "${{ github.repository }}" --ref main
