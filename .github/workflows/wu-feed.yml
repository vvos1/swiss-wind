name: wu-feed
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wu-feed
  cancel-in-progress: true
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Fetch Wunderground observations
        run: |
          mkdir -p site
          node wu-feed/scrape-wu-browser.mjs site/wu.json
      - name: Publish site to the gh-pages branch (single commit, no history build-up)
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "wu-feed"
          git config user.email "wu-feed@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
